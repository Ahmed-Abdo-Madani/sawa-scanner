name: sawa_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  http_parser: ^4.0.0
  mobile_scanner: ^5.0.0
  image_picker: ^1.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_fonts: ^6.2.1
  url_launcher: ^6.2.1
  fl_chart: ^0.66.2
  openfoodfacts: ^3.30.2
  flutter_svg: ^2.0.10
  geolocator: ^13.0.2
  cached_network_image: ^3.4.1
  firebase_core: ^4.4.0
  firebase_ai: ^3.6.0
  firebase_auth: ^6.4.0
  in_app_purchase: ^3.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/SVG/
